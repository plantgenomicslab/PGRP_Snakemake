#############################################################################################
# Inputs
# Configuration required
#############################################################################################
source: local                         # [local|sra] whether RNAseq data is stored locally or should be fetched from SRA
rawInputDir: placeholder              # (path) path to local RNAseq data directory (source=local)
sra_dir: placeholder                  # (path) path to sra directory... see README (source=sra)

libraryType: PAIRED                   # [PAIRED|SINGLE] RNAseq library type
PAIR_LIST: [_1, _2]                   # Unique suffixes used for paired-end read files (libraryType=PAIRED)

genomeDir: placeholder                # (path) Reference genome directory
GTFname: placeholder                  # (path) Path to GTF file for STAR alignment
# 'ref' (STAR index files to sanity-check) defaults to [SA, SAindex,
# exonGeTrInfo.tab]; set it only to override that list.

readCounting: [RSEM]                  # (list) Read counting methods to use. Options are (RSEM|featureCounts|HTseq|TPMcalculator)
RSEM_prepared_genome: placeholder     # (path) RSEM prepared reference genome...without extension (list includes RSEM)
strandedness: none                    # [none|forward|reverse] library strandedness, used by RSEM, featureCounts and HTseq
                                      # dUTP / Illumina TruSeq stranded = reverse. Unstranded = none.

runDEG: yes                           # [yes|no] Whether to perform DEG analysis using Trinity
                                      # NOTE: DEG anlaysis will be perfromed with all selected read counting methods except TPMcalculator
sample_contrast: placeholder          # (path) DEG contrasts to perform. If not included, all contrasts are calculated
rep_relations: replication_relationship.txt  # (path) Treatment/Replicate relationships, written here from RunsByExperiment.tsv on every run.
                                      # Hand-edited files are detected and preserved; see scripts/make_replication_relationship.py

#############################################################################################
# Threads 
# Configuration optional
#############################################################################################

threads:
  importRaw: 2
  fetchSRA: 2
  convertSRAtoFastq: 8
  fastqc_raw: 2
  trim: 16
  align: 16
  calculateRSEMExpression: 16
  merge: 16
  featureCount: 16
  HTseq: 16
  normalizeFeatureCounts: 2
  normalizeHTseq: 2
  TPMCalculator: 8
  mergeTPMCalculator: 2
  DEG_featureCounts: 8
  DEG_HTseq: 8
  DEG_RSEM: 8
  summarize: 2

#############################################################################################
# Cluster
# Configuration required
#############################################################################################
# Each block below is looked up by *rule name* (snakemake --cluster-config). A key that
# matches no rule is silently ignored and that rule falls back to __default__.

__default__:
  account: placeholder    # Provide your slurm account
  partition: placeholder  # Provide your slurm partition
  memory: 8g
  name: "{rule}.{wildcards}"
  ncpus: 2
  nodes: 1
  time: 7-0:00:00
  output: output/logs/{rule}.{wildcards}.out
  error: output/logs/{rule}.{wildcards}.err
fetchSRA:
